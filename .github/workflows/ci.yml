name: Native macOS
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: bash scripts/build-app.sh
      - run: ditto -c -k --sequesterRsrc --keepParent 'build/Smallibre.app' build/Smallibre.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Smallibre-macOS
          path: build/Smallibre.zip
